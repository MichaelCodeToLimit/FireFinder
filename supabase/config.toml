# Supabase CLI configuration for FireFinder.
# Only the settings FireFinder needs; everything else uses CLI defaults.
project_id = "firefinder"

[functions.firefinder]
# FireFinder authenticates callers with its own API keys (X-API-Key), so the
# gateway's Supabase-JWT check is disabled for this function.
verify_jwt = false
# Generated by `npm run build:edge` from apps/edge/src/main.ts.
entrypoint = "./functions/firefinder/index.js"
